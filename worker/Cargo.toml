[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "0.20.2", features = ["tls","streams"] }
redis_stream = {path="../redis_stream"}
uuid = {version = "1.18.1" ,features=["v4"]}
tokio = {version = "1.48.0" , features = ["full"]}
reqwest = { version = "0.11", features = ["blocking", "json"]}
store = {path ="../store"}
futures = "0.3.31"
lettre = "0.10"
dotenvy = "0.15.7"
serde_json = "1.0.149"
chrono = { version = "0.4", features = ["unstable-locales"] }

[[bin]]
name = "consumer"
path = "src/bin/consumer.rs"

[[bin]]
name = "publisher"
path = "src/bin/publisher.rs"

[[bin]]
name = "notifier"
path = "src/bin/notifier.rs"