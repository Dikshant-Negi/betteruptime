[package]
name = "store"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = {version = "0.8.6" , features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono", "uuid"]}
tokio = {version = "1.48.0" , features = ["full"]}
dotenvy = "0.15"
uuid = {version = "1.18.1" ,features=["v4"]}
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }