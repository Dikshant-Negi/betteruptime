services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  migrate:
    image: rust:latest
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
    command: >
      bash -c "
        cargo install sqlx-cli --no-default-features --features postgres &&
        cargo sqlx migrate run
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - migrate

  consumer:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["/usr/local/bin/consumer"]
    env_file:
      - .env
    depends_on:
      - api

  publisher:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["/usr/local/bin/publisher"]
    env_file:
      - .env
    depends_on:
      - api

  notifier:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["/usr/local/bin/notifier"]
    env_file:
      - .env
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  pgdata:
